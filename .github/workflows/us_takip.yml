name: US_Takip

on:
  schedule:
    - cron: '0 11 * * 1-5'    # Türkiye 17:00 (UTC 14:00) - Açılıştan sonra
    - cron: '0 16 * * 1-5'    # Türkiye 20:00 (UTC 17:00) - Öğleden sonra
    - cron: '30 19 * * 1-5'   # Türkiye 23:30 (UTC 20:30) - Kapanıştan sonra
  
  workflow_dispatch:  # Manuel çalıştırma

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yfinance requests pandas numpy
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python Us_Takip.py
